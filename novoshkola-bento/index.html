<script src="assets/js/photos.js"></script>
<script>
class Component extends DCLogic {
  componentDidUpdate(pp, ps) {
    const st = this.state || {};
    const was = !!(ps && ps.menu);
    if (st.menu && !was) { const m = document.getElementById('site-menu'); const f = m && m.querySelector('a,button'); if (f) f.focus(); }
    if (!st.menu && was) { const b = document.querySelector('.hdr-burger'); if (b) b.focus(); }
    if (this._focusTab) { this._focusTab = false; const t = document.getElementById('day-tab-' + (st.day || 'p')); if (t) t.focus(); }
  }
  renderVals() {
    const st = this.state || {};
    const day = st.day || 'p';
    const T = [
      { name: 'Григорій Овчаренко', role: 'Випускник 2021/2022, програма U-⁠CAN', quote: '…мені вдалося вступити до двох найкращих університетів Канади: University of Toronto та The University of British Columbia.' },
      { name: 'Кирил Гіловянц', role: 'Випускник 2019/2020', quote: 'Новопечерська школа навчила мене того, що спільнота, в якій ти перебуваєш під час навчання, відіграє надважливу роль.' },
      { name: 'Оксана Самусєва', role: 'Мама учнів початкової, середньої школи та КДП', quote: 'Я вдячна Школі за стійкі цінності, які не на папері, а в серцях і головах професійної команди.' },
      { name: 'Дар’я Місенг', role: 'Тьютор програми «Лідер у мені»', quote: 'Новопечерська школа — це той сприятливий простір для особистісного зростання, якого нам, дорослим, у свій час так не вистачало.' },
      { name: 'Марина Прокопенко', role: 'Мама Івана', quote: 'Ми обрали Новопечерську школу, тому що цілком поділяємо її філософію, яка базується на тому, що учні здобувають ґрунтовні академічні знання.' },
      { name: 'Марина Нікіфорчук', role: 'Мама Володимира', quote: 'Для нашої родини Новопечерська школа — це відкритий, розумний, розуміючий партнер.' },
      { name: 'Олена Ігнат’єва', role: 'Мама випускників Марії та Олександра', quote: 'В Школі прекрасна атмосфера, дуже доброзичлива і дружня. Уроки проходять дуже цікаво, творчо, інтенсивно.' },
      { name: 'Камілла Ружанська', role: 'Випускниця 2015/2016', quote: 'Як би я могла назвати своє навчання в Новопечерській школі? Мабуть, другий шанс…' }
    ];
    const n = T.length;
    const ti = typeof st.t === 'number' ? ((st.t % n) + n) % n : 0;
    const ini = (s) => s.split(' ').map((w) => w.charAt(0)).join('').slice(0, 2);
    const cur = T[ti];
    const people = T.map((p, i) => ({
      name: p.name,
      role: p.role,
      ini: ini(p.name),
      pressed: i === ti ? 'true' : 'false',
      bg: i === ti ? '#F1F2EE' : 'transparent',
      dot: i === ti ? '#5B3FA8' : '#EFEAFA',
      dotFg: i === ti ? '#FFFFFF' : '#5B3FA8',
      pick: () => this.setState({ t: i })
    }));

    const C = { lesson: '#5B3FA8', meal: '#8CC63F', club: '#E31E24', rest: '#D5D8D2', gap: 'transparent' };
    const D = {
      k: {
        title: 'Дошкільна підготовка (КДП), 4–5 років',
        note: 'Ранкове коло, робота в навчальних осередках, денний відпочинок і чотириразове харчування.',
        club: 'Гуртки — з 14:15 (за розкладом групи)',
        pickup: 'Забрати дитину: 17:45–18:00',
        rows: [
          ['8:30', '9:00', 'rest', 'Зустріч на вулиці й підготовка до дня'],
          ['9:00', '12:00', 'lesson', 'Активності, робота в осередках, прогулянка'],
          ['12:00', '12:30', 'meal', 'Обід'],
          ['12:30', '13:30', 'rest', 'Година відпочинку'],
          ['13:30', '14:00', 'meal', 'Активності на вулиці'],
          ['14:00', '14:15', 'gap', ''],
          ['14:15', '15:00', 'club', 'Гуртки'],
          ['15:00', '15:30', 'meal', 'Підвечірок'],
          ['15:30', '17:00', 'lesson', 'Активності, проєкти, прогулянка'],
          ['17:00', '17:30', 'meal', 'Вечеря'],
          ['17:30', '17:45', 'gap', ''],
          ['17:45', '18:00', 'rest', 'Діти йдуть додому']
        ]
      },
      p: {
        title: 'Початкова школа, 1–4 класи',
        note: 'Шість уроків по 40 хвилин і три перерви на їжу й прогулянку.',
        club: 'Гуртки — 16:10–18:00',
        pickup: 'Забрати дитину: о 16:00 або о 17:00',
        rows: [
          ['8:30', '9:00', 'rest', 'Зустріч на вулиці, вхід до класів'],
          ['9:00', '9:40', 'lesson', '1 урок'],
          ['9:40', '9:55', 'gap', ''],
          ['9:55', '10:35', 'lesson', '2 урок'],
          ['10:35', '11:10', 'meal', 'Прогулянка, бранч'],
          ['11:10', '11:50', 'lesson', '3 урок'],
          ['11:50', '12:05', 'gap', ''],
          ['12:05', '12:45', 'lesson', '4 урок'],
          ['12:45', '13:40', 'meal', 'Обід, прогулянка'],
          ['13:40', '14:20', 'lesson', '5 урок'],
          ['14:20', '14:30', 'gap', ''],
          ['14:30', '15:10', 'lesson', '6 урок'],
          ['15:10', '16:10', 'meal', 'Підвечірок, прогулянка'],
          ['16:10', '16:55', 'club', 'Гуртки'],
          ['16:55', '17:10', 'gap', ''],
          ['17:10', '17:55', 'club', 'Гуртки'],
          ['17:55', '18:00', 'gap', '']
        ]
      },
      s: {
        title: 'Середня і старша школа, 5–11 класи',
        note: 'Сім уроків по 45 хвилин, легкий сніданок і обід з прогулянкою.',
        club: 'Діяльність за вибором — 16:15–18:00',
        pickup: 'Забрати дитину: [уточнити в школи]',
        rows: [
          ['8:30', '9:00', 'gap', ''],
          ['9:00', '9:45', 'lesson', '1 урок'],
          ['9:45', '9:55', 'gap', ''],
          ['9:55', '10:40', 'lesson', '2 урок'],
          ['10:40', '11:00', 'meal', 'Легкий сніданок, прогулянка'],
          ['11:00', '11:45', 'lesson', '3 урок'],
          ['11:45', '11:55', 'gap', ''],
          ['11:55', '12:40', 'lesson', '4 урок'],
          ['12:40', '12:50', 'gap', ''],
          ['12:50', '13:35', 'lesson', '5 урок'],
          ['13:35', '14:20', 'meal', 'Обід, прогулянка'],
          ['14:20', '15:05', 'lesson', '6 урок'],
          ['15:05', '15:15', 'gap', ''],
          ['15:15', '16:00', 'lesson', '7 урок'],
          ['16:00', '16:15', 'gap', ''],
          ['16:15', '17:00', 'club', 'Діяльність за вибором'],
          ['17:00', '17:15', 'meal', 'Підвечірок'],
          ['17:15', '18:00', 'club', 'Діяльність за вибором']
        ]
      }
    };
    const toMin = (s) => { const p = s.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); };
    const cd = D[day] || D.p;
    const segs = cd.rows.map((r) => ({
      grow: toMin(r[1]) - toMin(r[0]),
      bg: C[r[2]],
      time: r[0] + '–' + r[1],
      label: r[3] || 'Перерва',
      kind: r[2]
    }));
    const list = segs.filter((s) => s.kind !== 'gap');
    const order = ['k', 'p', 's'];
    const labels = { k: 'КДП · 4–5 років', p: '1–4 класи', s: '5–11 класи' };
    const tabs = order.map((k) => ({
      id: 'day-tab-' + k,
      label: labels[k],
      selected: k === day ? 'true' : 'false',
      tabindex: k === day ? '0' : '-1',
      bg: k === day ? '#16181A' : '#FFFFFF',
      fg: k === day ? '#FFFFFF' : '#3A3E42',
      bd: k === day ? '#16181A' : '#E3E5E0',
      pick: () => this.setState({ day: k })
    }));
    const tabKey = (e) => {
      if (!e) return;
      const i = order.indexOf(day);
      let ni = -1;
      if (e.key === 'ArrowRight') ni = (i + 1) % order.length;
      else if (e.key === 'ArrowLeft') ni = (i - 1 + order.length) % order.length;
      else if (e.key === 'Home') ni = 0;
      else if (e.key === 'End') ni = order.length - 1;
      if (ni < 0) return;
      if (e.preventDefault) e.preventDefault();
      this._focusTab = true;
      this.setState({ day: order[ni] });
    };

    return {
      menuOpen: !!st.menu,
      menuExpanded: st.menu ? 'true' : 'false',
      openMenu: () => this.setState({ menu: true }),
      closeMenu: () => this.setState({ menu: false }),
      menuKey: (e) => { if (e && e.key === 'Escape') this.setState({ menu: false }); },
      tabs: tabs,
      tabKey: tabKey,
      panelLabel: 'day-tab-' + day,
      segs: segs,
      list: list,
      dayTitle: cd.title,
      dayNote: cd.note,
      clubNote: cd.club,
      pickup: cd.pickup,
      q: { quote: cur.quote, name: cur.name, role: cur.role, ini: ini(cur.name) },
      people: people,
      pos: 'Відгук ' + (ti + 1) + ' з ' + n,
      prev: () => this.setState({ t: (ti - 1 + n) % n }),
      next: () => this.setState({ t: (ti + 1) % n })
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
