      };
    });
    let counter = 'Показано ' + list.length + ' ' + pl(list.length);
    if (g > 0) counter += ' для ' + g + ' класу';
    if (cf !== 'all') counter += ' · ' + CAT[cf].label;
    const collapsed = !st.more && list.length > 12;

    return {
      menuOpen: !!st.menu,
      menuExpanded: st.menu ? 'true' : 'false',
      openMenu: () => this.setState({ menu: true }),
      closeMenu: () => this.setState({ menu: false }),
      menuKey: (e) => { if (e && e.key === 'Escape') this.setState({ menu: false }); },

      dayTabs: dayTabs,
      dayKey: dayKey,
      dayTabId: 'day-tab-' + day,
      dayTitle: cd.title,
      dayNote: cd.note,
      dayClubs: cd.club,
      dayPickup: cd.pickup,
      segs: segs,
      dayList: dayList,

      grades: grades,
      gradeValue: String(g),
      pickGradeSel: (e) => {
        const v = parseInt(e && e.target ? e.target.value : '0', 10);
        this.setState({ g: isNaN(v) ? 0 : v, more: false });
      },
      tabs: tabs,
      clubs: clubs,
      counter: counter,
      noClubs: list.length === 0,
      emptyText: g > 0 && cf !== 'all'
        ? 'Для ' + g + ' класу в напрямі «' + CAT[cf].label + '» гуртків немає'
        : 'Гуртків за цими умовами немає',
      resetCat: () => { this._focusCat = true; this.setState({ cf: 'all' }); },
      collapsed: collapsed ? 'true' : 'false',
      showMore: collapsed,
      moreLabel: 'Показати всі (' + list.length + ')',
      expand: () => { this._focusList = true; this.setState({ more: true }); }
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
