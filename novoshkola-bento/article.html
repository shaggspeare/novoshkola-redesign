<p style="margin: 0; text-wrap: pretty">За підсумками змагань дівчата вибороли призові місця в обох програмах — сольній і груповій.</p>

<script>
class Component extends DCLogic {
  componentDidUpdate(pp, ps) {
    const st = this.state || {};
    const was = !!(ps && ps.menu);
    if (st.menu && !was) { const m = document.getElementById('site-menu'); const f = m && m.querySelector('a,button'); if (f) f.focus(); }
    if (!st.menu && was) { const b = document.querySelector('.hdr-burger'); if (b) b.focus(); }
  }
  renderVals() {
    const st = this.state || {};
    const copied = st.copied === true;
    const PAGE_URL = 'https://novoshkola.com.ua/uk/news/tournament_majorette_sports/';
    const TITLE = 'Учениці Новопечерської здобули призові місця на чемпіонаті світу з мажорет-спорту';
    const copyLink = () => {
      try {
        if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(PAGE_URL).catch(function () {});
        }
      } catch (e) { /* clipboard may be unavailable in previews */ }
      this.setState({ copied: true });
    };
    const shareLink = () => {
      let shared = false;
      try {
        if (typeof navigator !== 'undefined' && typeof navigator.share === 'function') {
          const p = navigator.share({ title: TITLE, text: TITLE, url: PAGE_URL });
          if (p && p.catch) p.catch(function () {});
          shared = true;
        }
      } catch (e) { shared = false; }
      if (!shared) copyLink();
    };
    return {
      copy: copyLink,
      share: shareLink,
      copyLabel: copied ? 'Посилання скопійовано' : 'Копіювати посилання',
      copiedNote: copied ? 'Посилання скопійовано' : '',
      menuOpen: !!st.menu,
      menuExpanded: st.menu ? 'true' : 'false',
      openMenu: () => this.setState({ menu: true }),
      closeMenu: () => this.setState({ menu: false }),
      menuKey: (e) => { if (e && e.key === 'Escape') this.setState({ menu: false }); }
    };
  }
}
DC.mount(Component, {});
</script>
